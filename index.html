<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><title>ResolveIQ</title>

<style>
:root{--bg:#f4f6f8;--sf:#fff;--tx:#15202b;--mu:#5b6b7a;--bd:#dde3e9;--sh:#0f1a24;--shx:#c9d4de;--ac:#0e8f8a;--acx:#fff;--ok:#1a7f4b;--wn:#a15c00;--er:#b3261e;--fn:Inter,Geist,"Segoe UI",system-ui,sans-serif;--mo:ui-monospace,Consolas,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1218;--sf:#131d26;--tx:#e6edf3;--mu:#92a3b3;--bd:#233140;--sh:#070c11;--ac:#2cc4bc;--acx:#04201f;--ok:#4ccb8a;--wn:#f0b45a;--er:#ff8b82;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0b1218;--sf:#131d26;--tx:#e6edf3;--mu:#92a3b3;--bd:#233140;--sh:#070c11;--ac:#2cc4bc;--acx:#04201f;--ok:#4ccb8a;--wn:#f0b45a;--er:#ff8b82;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:15px/1.5 var(--fn);display:flex}
a{color:inherit}button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
aside{width:210px;background:var(--sh);color:var(--shx);padding:18px 12px;display:flex;flex-direction:column;gap:4px;flex:none}
.logo{font-weight:700;font-size:18px;color:#fff;padding:0 10px 14px;letter-spacing:-.01em}.logo b{color:#2cc4bc}
aside a{padding:8px 10px;border-radius:6px;text-decoration:none;font-size:14px}aside a:hover{background:#1b2a37}aside a.on{background:#1b2a37;color:#fff;box-shadow:inset 3px 0 #2cc4bc}
aside small{margin-top:auto;padding:10px;color:#7d91a3;font-size:12px}
main{flex:1;min-width:0;overflow:auto;padding:28px clamp(16px,4vw,48px)}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}h2{font-size:16px;margin:0 0 8px}.mu{color:var(--mu)}.sm{font-size:13px}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:16px;margin:12px 0}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1 1 280px;min-width:0}
input,textarea,select{width:100%;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:9px 11px}
textarea{min-height:70px;resize:vertical}label{display:block;font-size:13px;color:var(--mu);margin:10px 0 3px}
.btn{background:var(--ac);color:var(--acx);border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn:hover{filter:brightness(1.08)}
.opt{display:block;width:100%;text-align:left;background:var(--sf);border:1px solid var(--bd);border-radius:6px;padding:10px 12px;margin:6px 0;cursor:pointer}.opt:hover{border-color:var(--ac)}
pre{background:var(--sh);color:#d5e3ee;border-radius:6px;padding:10px 12px;overflow-x:auto;font:13px var(--mo);margin:8px 0}
.tag{display:inline-block;font-size:12px;border-radius:4px;padding:1px 7px;border:1px solid currentColor;font-weight:600}
.r0{color:var(--ok)}.r1{color:var(--wn)}.r2{color:var(--er)}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .25s}
.hl{display:grid;grid-template-columns:1fr 44px;gap:2px 10px;align-items:center;font-size:13px}
.ev li{margin:3px 0}.ev button{border:0;background:none;color:var(--ac);cursor:pointer;padding:0;font-size:12px}
.warn{border-left:4px solid var(--wn);background:color-mix(in srgb,var(--wn) 10%,var(--sf));padding:10px 12px;border-radius:6px;margin:10px 0}

.hero .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#2cc4bc;font-weight:600}
.hero h1{font-size:clamp(26px,4vw,38px);color:#fff;letter-spacing:-.02em;margin:6px 0 8px}.hero p{color:#9fb2c3;max-width:62ch;margin:0 0 18px}

.hero .btn{padding:12px 22px}.chip{display:inline-block;border:1px solid #2a3b4b;color:#c9d4de;background:transparent;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer;margin:8px 6px 0 0}.chip:hover{border-color:#2cc4bc;color:#fff}

.sec{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:22px 0 8px;font-weight:600}
.pr{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.pr div{border-left:3px solid var(--ac);padding-left:12px;font-size:14px}.pr b{display:block}
.pl a{display:inline-block;border:1px solid var(--bd);background:var(--sf);border-radius:6px;padding:4px 10px;margin:4px 6px 0 0;font-size:13px;text-decoration:none}.pl a:hover{border-color:var(--ac)}
@media(max-width:800px){body{flex-direction:column}aside{width:100%;flex-direction:row;flex-wrap:wrap;padding:8px}.logo{padding:6px 10px}aside small{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Command reference ---------- */
const CMD=[
["ipconfig /all","Show full IP configuration for every adapter.",0,"Standard","Look at IPv4 address, mask, gateway, DHCP server and DNS servers. 169.254.x.x means DHCP failed.","ping, nslookup, Get-NetIPConfiguration"],

["Reading ipconfig /all","Networking","Overview: ipconfig /all lists address, mask, gateway, DHCP and DNS servers for each adapter.\nSteps: find the active adapter; check the address is in the expected range (169.254.x.x means DHCP failed); confirm the gateway is in the same subnet as the address; note the DNS servers.\nEscalate when several devices show self-assigned addresses."],
["DNS failure versus no connectivity","Networking","Overview: if ping to an IP works but names fail, the fault is name resolution, not routing.\nSteps: ping 1.1.1.1; run nslookup against the configured server; repeat against a known public resolver. If only the configured server fails, the client DNS setting or server is at fault.\nCommon mistake: flushing the cache when the server setting is wrong."],
["Why accounts lock out","Identity and access","Overview: lockouts follow repeated bad passwords, usually from a stale saved credential rather than the user typing.\nSteps: verify identity; unlock only through the permitted route; ask about phones, mapped drives, VPN and scheduled tasks using the old password.\nSecurity: repeated rapid lockouts can indicate password spraying. Escalate to security."],
["Priority is impact and urgency","ITIL and ITSM","Overview: priority is derived from impact (how many or how important) and urgency (how soon it must be fixed). Severity is a different measure used by some teams.\nExample: one user locked out an hour before a board meeting may be high urgency, low impact. A department printer outage may be the opposite.\nOrganisations define their own matrices; learn yours."],
["Writing a ticket someone can act on","Service desk communication","Overview: record symptom, scope, what you checked, what you observed and the next action.\nSteps: separate facts from assumptions; include exact error text and times; never invent steps or results; leave a placeholder when unknown.\nExample: replace 'Outlook broken, fixed' with the symptom, the test, the result and the change."],
["Outlook: client, account or service?","Microsoft 365","Overview: test Outlook on the web first. If it works, the account is healthy and the client or profile is suspect. If it fails, look at account state and sign-in logs.\nSteps: check scope; test browser; check stored credentials; try a new profile.\nEscalate when many users are affected or Conditional Access is involved. Confirm specifics in Microsoft Learn."],
["Safe use of state-changing commands","Troubleshooting methodology","Overview: diagnostics should be read-only first. Commands that restart services, kill processes, change DNS or reset networking can interrupt the user or others.\nSteps: state the risk; check permissions; warn the user; record the previous state so you can roll back; note it in the ticket.\nEscalate when the action affects shared servers or you lack explicit authority."],
["Event Viewer basics","Windows","Overview: Event Viewer records system, application and security events. Use it to find what happened near the time of the fault.\nSteps: open Windows Logs, System or Application; filter by Error and Critical around the incident time; record the source and Event ID; search the exact ID rather than guessing.\nSecurity: the Security log usually needs admin rights."],
["Access denied: groups and permissions","Identity and access","Overview: access depends on group membership and permissions on the resource. New group membership applies only after a fresh sign-in.\nSteps: confirm the exact resource and error; check the user's groups (whoami /groups); compare with a user who has access; ask the resource owner to approve access.\nSecurity: apply least privilege; never grant access without owner approval."],
["Recognising a possible major incident","ITIL and ITSM","Overview: many users affected, a core service down or a security risk may need the major incident process.\nSteps: count reports and affected sites; check service health; link tickets to one parent; alert the duty manager; keep the user updates factual.\nSecurity: suspected ransomware or data exfiltration means follow incident response, preserve evidence and do not attempt repairs."]];

function walk(){const p=PB[cur.pb];let id="a";const path=[];for(const s of cur.hist){const n=p.n[id],o=n.o[s.o];path.push({id,n,o});id=o.n}return{id,path,node:p.n[id]}}

:`<div class="box"><span class="tag r${node.risk}">${RK[node.risk]}</span> <span class="sm mu">Permissions: ${esc(node.perm)}</span><h2 style="margin-top:8px">${esc(node.q)}</h2><p class="sm">${esc(node.why)}</p><pre>${esc(node.cmd)}</pre><button class="btn g sm" data-copy="${esc(node.cmd)}">Copy</button><p class="sm mu">Illustrative guidance. Run it yourself and record what you actually see.</p>${node.o.map((o,i)=>`<button class="opt" data-o="${i}">${esc(o.l)}</button>`).join("")}</div>`);

if($("#fs")||$("#out")){const u=()=>$("#out").value=ticketOut();A.querySelectorAll("[data-f]").forEach(t=>t.oninput=u);u();$("#cp").onclick=()=>copy($("#out").value)}
if($("#th")){$("#th").value=DB.theme;$("#th").onchange=e=>{DB.theme=e.target.value;theme();save()}
$("#ex").onclick=()=>{const b=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="resolveiq-backup.json";a.click()};
$("#im").onclick=()=>$("#fi").click();
$("#fi").onchange=async e=>{try{const x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.sessions)||!x.sessions.every(s=>PB[s.pb]&&Array.isArray(s.hist)&&s.hist.every(h=>Number.isInteger(h.o))))throw 0;DB={theme:["auto","light","dark"].includes(x.theme)?x.theme:"auto",sessions:x.sessions.slice(0,30).map(s=>({id:+s.id||Date.now(),pb:s.pb,hist:s.hist.map(h=>({o:h.o})),title:String(s.title||"").slice(0,120),ts:+s.ts||Date.now()})),recent:[]};save();theme();toast("Backup imported");render()}catch(err){toast("Import failed: file is not a valid ResolveIQ backup")}};
$("#rd").onclick=()=>{if(confirm("Delete all saved sessions and preferences from this browser?")){DB={theme:"auto",sessions:[],recent:[]};save();theme();render()}}}}
addEventListener("hashchange",()=>{cur=route()[2]===cur?.pb?cur:null;render()});
addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();if(location.hash!=="#/"&&location.hash!=="")location.hash="#/";else render();setTimeout(()=>$("#q")?.focus(),0)}});
render();
</script></body></html>
